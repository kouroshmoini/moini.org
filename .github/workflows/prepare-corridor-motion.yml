name: Prepare corridor animation
on: pull_request
permissions:
  contents: read
jobs:
  render:
    if: github.head_ref == 'chinatown/continuous-map-motion'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Render the browser fallback
        run: |
          python -m pip install --quiet imageio-ffmpeg==0.6.0
          ffmpeg_path="$(python -c 'import imageio_ffmpeg; print(imageio_ffmpeg.get_ffmpeg_exe())')"
          "$ffmpeg_path" -hide_banner -loglevel error -i assets/uploads/chinatown-gateway/corridor-day-night.mp4 -vf 'fps=20,scale=768:-1:flags=lanczos' -c:v libwebp_anim -quality 70 -compression_level 4 -loop 0 -an /tmp/corridor-motion.webp
          printf 'CORRIDOR_BYTES='
          stat --format=%s /tmp/corridor-motion.webp
          git hash-object /tmp/corridor-motion.webp
      - uses: actions/upload-artifact@v4
        with:
          name: corridor-motion
          path: /tmp/corridor-motion.webp
          retention-days: 1
  return:
    needs: render
    runs-on: ubuntu-24.04
    strategy:
      matrix:
        part: [0, 1, 2, 3]
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: corridor-motion
      - name: Return an animation segment
        env:
          PART: ${{ matrix.part }}
        run: dd if=corridor-motion.webp bs=1572864 skip="$PART" count=1 status=none | base64 -w 16000
