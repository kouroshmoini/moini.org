name: Prepare report redactions
on:
  push:
    branches: [report-privacy-work]
permissions:
  contents: write
jobs:
  redact:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - name: Install PDF and OCR tools
        run: |
          sudo apt-get update -q
          sudo apt-get install -y --no-install-recommends tesseract-ocr tesseract-ocr-fra
          python -m pip install pymupdf pillow pytesseract
      - name: Remove credits and verify files
        run: python .github/report-redaction.py
      - name: Save redacted files to the work branch
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -- assets/uploads/
          git commit -m 'Prepare privacy-redacted portfolio report files'
          git push origin HEAD:report-privacy-work
