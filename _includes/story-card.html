<section class="story-card" data-story aria-label="{{ include.title | escape }} project views">
  {% for slide in include.slides %}
  <figure class="story-slide"{% unless forloop.first %} hidden{% endunless %}>
    <div class="story-stage">
      <div class="story-leaf">
        <div class="story-front"><img src="{{ slide.src | relative_url }}" alt="{{ slide.alt | escape }}"{% if include.featured and forloop.first %} fetchpriority="high"{% else %} loading="lazy"{% endif %}></div>
        <div class="story-back" aria-hidden="true"><strong>{{ slide.label }}</strong><p>{{ slide.note }}</p></div>
      </div>
    </div>
    <figcaption><span>{{ forloop.index }} / {{ forloop.length }}</span><strong>{{ slide.label }}</strong></figcaption>
  </figure>
  {% endfor %}
  <div class="story-controls" hidden>
    <button type="button" data-flip aria-pressed="false">Read note</button>
    <button type="button" data-step="-1" aria-label="Previous project view">←</button>
    <button type="button" data-step="1" aria-label="Next project view">→</button>
  </div>
  <span class="sr-only" role="status"></span>
</section>
