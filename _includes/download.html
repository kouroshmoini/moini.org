<section class="report-download" id="{{ include.id }}" aria-label="Full document">
  <div><p class="eyebrow">Original document</p><h2>{{ include.title }}</h2></div>
  <a class="button button-primary" href="{{ include.src | relative_url }}" target="_blank" rel="noopener">Read PDF <span aria-hidden="true">↗</span></a>
  <a class="text-link" href="{{ include.src | relative_url }}" download>Download PDF <span aria-hidden="true">↓</span></a>
</section>
