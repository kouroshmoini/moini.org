{% assign stats = include.data %}
<div class="proposal-statistics" aria-label="{{ stats.title | escape }}">
  {% for item in stats.items %}
  <div><span class="eyebrow">{{ item.label | escape }}</span><strong>{{ item.value | escape }}</strong><span>{{ item.detail | escape }}</span></div>
  {% endfor %}
</div>
{% if stats.note %}<p class="data-source">{{ stats.note | escape }}</p>{% endif %}
