<section class="project-map" data-project-map aria-label="Explore the corridor interventions">
<figure class="corridor-diagram">
  <div class="corridor-heading">
    <p class="eyebrow">Rue de la Gauchetière</p>
    <h3>Four interventions along one corridor</h3>
  </div>
  <div class="corridor-direction" aria-hidden="true"><span>West</span><span>East →</span></div>
  <ol class="corridor-stops" role="list">
    <li><a href="#safer-crossing"><span class="corridor-number" aria-hidden="true">1</span><strong>Safer crossing</strong><span>Boulevard Saint-Laurent</span></a></li>
    <li><a href="#art-and-wayfinding"><span class="corridor-number" aria-hidden="true">2</span><strong>Art and wayfinding</strong><span>East of Rue Saint-Dominique</span></a></li>
    <li><a href="#outdoor-activity"><span class="corridor-number" aria-hidden="true">3</span><strong>Outdoor activity</strong><span>Between Rue De Bullion and Avenue de l’Hôtel-de-Ville</span></a></li>
    <li><a href="#alley-mural"><span class="corridor-number" aria-hidden="true">4</span><strong>Alley mural</strong><span>Near Rue Sainte-Élisabeth</span></a></li>
  </ol>
  <div class="corridor-preview" id="corridor-preview" hidden role="region" aria-label="Selected intervention"></div>
  <figcaption>Approximate locations, shown schematically. Select a stop to explore its proposal.</figcaption>
</figure>
  <figure class="chinatown-plate">
    <div class="project-map-stage">
      <a data-image-viewer class="chinatown-map-link" href="{{ '/assets/uploads/chinatown-gateway/chinatown-corridor-map.jpg' | relative_url }}" aria-label="Enlarge and explore the Chinatown corridor concept map">
        <img src="{{ '/assets/uploads/chinatown-gateway/chinatown-corridor-map.jpg' | relative_url }}" width="1651" height="953" alt="Bird’s-eye concept plan of Montréal’s Chinatown with the red corridor route, four numbered interventions, green spaces, market, library and outdoor activity spaces." loading="lazy">
      </a>
      {% for point in site.data.project_interactions.chinatown %}
      <a class="map-hotspot map-hotspot-{{ point.number }}" href="#{{ point.id }}" data-intervention="{{ point.id }}" aria-label="{{ point.number }}. {{ point.title }}"><span aria-hidden="true">{{ point.number }}</span></a>
      {% endfor %}
    </div>
    <figcaption>Concept illustration of Rue de la Gauchetière, showing the proposed route and key public-realm spaces. The image is illustrative and is not a surveyed or scale-accurate base map. Select a numbered marker to open its proposal above, or select the map to enlarge it.</figcaption>
  </figure>
</section>
