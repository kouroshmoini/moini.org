media:
  - name: all_uploads
    label: All uploads
    input: assets/uploads
    output: /assets/uploads
    rename: safe

content:
  - name: posts
    label: Blog Posts
    type: collection
    path: _posts
    format: yaml-frontmatter
    filename:
      template: "{year}-{month}-{day}-{title}.md"
      field: create
    view:
      fields: [title, date, visibility]
      primary: title
      sort: [date, title]
      default:
        sort: date
        order: desc
    fields:
      - name: title
        label: Title
        type: string
        required: true

      - name: media_folder
        label: Media Folder
        description: Optional subfolder for this post’s files. The folder is assigned after the first save.
        type: string
        readonly: true
        required: false

      - name: date
        label: Date
        description: The date and time shown on the post, in Toronto time.
        type: date
        required: true
        options:
          time: true
          format: "yyyy-MM-dd'T'HH:mm"

      - name: visibility
        label: Visibility
        description: Hidden keeps the post off the website. Use Visible and a date no later than today to publish immediately.
        type: select
        default: hidden
        options:
          values:
            - value: visible
              label: Visible
            - value: hidden
              label: Hidden

      - name: subtitle
        label: Summary
        type: string
        required: false

      - name: hero_image
        label: Hero Image
        type: image
        options:
          media: all_uploads
          categories: [image]

      - name: hero_alt
        label: Hero Image Alt Text
        type: string

      - name: hero_caption
        label: Hero Caption
        type: string

      - name: seo_title
        label: SEO Title
        type: string
        required: false

      - name: seo_description
        label: SEO Description
        type: text
        required: false

      - name: og_image
        label: Social Preview Image
        type: image
        required: false
        options:
          media: all_uploads
          categories: [image]

      - name: noindex
        label: Hide From Search Engines
        type: boolean
        default: false

      - name: content_blocks
        label: Content
        description: Add a Rich Text block to write the post. Raw HTML blocks are available for custom layouts.
        type: block
        required: false
        list:
          collapsible:
            collapsed: true
            summary: "Item #{index} {fields.block_label}"
        blocks:
          - name: rich_text
            label: Rich Text
            fields:
              - name: block_label
                label: Block Name (optional)
                type: string
              - name: content
                label: Content
                type: rich-text
                options:
                  media: all_uploads
                  categories: [image]

          - name: raw_html
            label: Raw HTML
            fields:
              - name: block_label
                label: Block Name (optional)
                type: string
              - name: html
                label: HTML Snippet
                type: code
                options:
                  language: html

  - name: home_page
    label: Home Page (HTML)
    type: file
    path: index.html
    format: yaml-frontmatter
    fields:
      - name: layout
        type: string
        hidden: true
        default: default

      - name: title
        label: Title
        type: string

      - name: seo_title
        label: SEO Title
        type: string
        required: false

      - name: seo_description
        label: SEO Description
        type: text
        required: false

      - name: og_image
        label: Social Preview Image
        type: image
        required: false
        options:
          media: all_uploads
          categories: [image]

      - name: noindex
        label: Hide From Search Engines
        type: boolean
        default: false

      - name: top_notice_enabled
        label: Top Notice (Show)
        description: Turn on to show a notice box at the top of the Home page.
        type: boolean
        default: false

      - name: top_notice_html
        label: Top Notice HTML
        description: HTML content for the top Home notice box.
        type: code
        required: false
        options:
          language: html

      - name: body
        label: HTML Content
        type: code
        options:
          language: html

  - name: about_page
    label: About Page (HTML)
    type: file
    path: about/index.html
    format: yaml-frontmatter
    fields:
      - name: layout
        type: string
        hidden: true
        default: default

      - name: title
        label: Title
        type: string
        default: About

      - name: seo_title
        label: SEO Title
        type: string
        required: false

      - name: seo_description
        label: SEO Description
        type: text
        required: false

      - name: og_image
        label: Social Preview Image
        type: image
        required: false
        options:
          media: all_uploads
          categories: [image]

      - name: noindex
        label: Hide From Search Engines
        type: boolean
        default: false

      - name: permalink
        type: string
        hidden: true
        default: /about/

      - name: body
        label: HTML Content
        type: code
        options:
          language: html

settings:
  content:
    merge: true
