---
layout: default
---
<article class="post">
  <header class="post-header page-heading">
    <a class="text-link back-link" href="{{ '/blog/' | relative_url }}"><span aria-hidden="true">←</span> Writing</a>
    <p class="eyebrow"><time datetime="{{ page.date | date_to_xmlschema }}">{{ page.date | date: "%B %-d, %Y" }}</time></p>
    <h1>{{ page.title | escape }}</h1>
    {% if page.subtitle %}<p>{{ page.subtitle | escape }}</p>{% endif %}
  </header>

  {% if page.hero_image %}
    <figure class="post-hero">
      <img class="hero-img" src="{{ page.hero_image | relative_url }}" alt="{{ page.hero_alt | escape }}" fetchpriority="high">
      {% if page.hero_caption %}<figcaption class="hero-caption">{{ page.hero_caption | escape }}</figcaption>{% endif %}
    </figure>
  {% endif %}

  <div class="post-body">
    {{ content }}
  </div>
</article>
